<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funato Campus - Students Login</title>
    <!-- ADD THIS INSIDE <head> -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet" href="assets/css/auth.css">
    
</head>
<body>
    <div class="card" id="logindiv">
        <h2>Students Login</h2>
   <!-- Add data-redirect to form -->
<form id="loginForm" data-redirect="dashboard.html">


            <div class="form-group"><input type="email" id="loginEmail" class="form-input" placeholder=" " required><label for="loginEmail" class="form-label">Email</label><span class="form-error">Required</span></div>
       <div class="form-group password-group">
  <input type="password" id="loginPassword" class="form-input" placeholder=" " required>
  <label for="loginPassword" class="form-label">Password</label>
  <span class="form-error">Required</span>
    <!-- Ensure password toggle button has proper structure -->
<button type="button" class="password-toggle" aria-label="Toggle password visibility">
    <!-- Eye Open (Default) -->
    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
    <!-- Eye Closed (Hidden initially) -->
    <svg class="eye-closed hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
      <line x1="1" y1="1" x2="23" y2="23"></line>
    </svg>
</button>



</div>
        <p style="color: rgb(232, 0, 0); text-align: right; cursor: pointer;" id="reset-link">Forgot Password? Reset</p>
        <button type="submit">Login</button>
        </form>
         <p style="text-align:center;margin-top:1rem;color:var(--muted)">New student? <a href="/register.html" style="color:var(--accent)">Register here</a></p>
      
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
